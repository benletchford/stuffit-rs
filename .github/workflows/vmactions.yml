name: VM builds

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  SMARTOS_BOOTSTRAP_URL: https://pkgsrc.smartos.org/packages/SmartOS/bootstrap/bootstrap-2025Q4-x86_64.tar.gz
  SMARTOS_BOOTSTRAP_SHA256: 4842f72b610d44cf98560253b6bf16ff4056016e5fe2c6932bc195156ac75772

jobs:
  dragonflybsd:
    name: DragonFlyBSD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, and install
        uses: vmactions/dragonflybsd-vm@bc8ccbaa091ce3624c93f2dc328ae48129b07580 # v1.3.1
        with:
          prepare: pkg install -y gmake pkgconf rust
          run: |
            set -e
            cargo test --workspace --locked
            cargo build --release --locked
            cargo build --release --locked -p stuffit-ffi
            gmake -C stuffit-ffi install-files PREFIX=/usr/local
            export LD_LIBRARY_PATH=/usr/local/lib
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig
            c_compiler=$(command -v cc || command -v gcc)
            "$c_compiler" stuffit-ffi/examples/probe.c -o stuffit-ffi-probe $(pkg-config --cflags --libs stuffit-ffi)

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, and install
        uses: vmactions/freebsd-vm@5a72679103d223925653750faa878a143340fbd0 # v1.5.0
        with:
          prepare: pkg install -y gmake pkgconf rust
          run: |
            set -e
            cargo test --workspace --locked
            cargo build --release --locked
            cargo build --release --locked -p stuffit-ffi
            gmake -C stuffit-ffi install-files PREFIX=/usr/local
            export LD_LIBRARY_PATH=/usr/local/lib
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig
            c_compiler=$(command -v cc || command -v gcc)
            "$c_compiler" stuffit-ffi/examples/probe.c -o stuffit-ffi-probe $(pkg-config --cflags --libs stuffit-ffi)

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, and install
        uses: vmactions/netbsd-vm@fac0a63f3e5244c600cb9ca532d27ee774ecdb4b # v1.4.3
        with:
          prepare: |
            export PKG_PATH="https://ftp.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r | cut -f '1 2' -d.)/All"
            pkg_add gmake pkg-config rust
          run: |
            set -e
            cargo test --workspace --locked
            cargo build --release --locked
            cargo build --release --locked -p stuffit-ffi
            gmake -C stuffit-ffi install-files PREFIX=/usr/local
            export LD_LIBRARY_PATH=/usr/local/lib
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            c_compiler=$(command -v cc || command -v gcc)
            "$c_compiler" stuffit-ffi/examples/probe.c -o stuffit-ffi-probe $(pkg-config --cflags --libs stuffit-ffi)

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, and install
        uses: vmactions/openbsd-vm@c941015845c0f0c429676840963dc63b226d4f69 # v1.4.5
        with:
          prepare: pkg_add -I gmake pkg-config rust
          run: |
            set -e
            cargo test --workspace --locked
            cargo build --release --locked
            cargo build --release --locked -p stuffit-ffi
            gmake -C stuffit-ffi install-files PREFIX=/usr/local
            export LD_LIBRARY_PATH=/usr/local/lib
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            c_compiler=$(command -v cc || command -v gcc)
            "$c_compiler" stuffit-ffi/examples/probe.c -o stuffit-ffi-probe $(pkg-config --cflags --libs stuffit-ffi)

  omnios:
    name: OmniOS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, and install
        uses: vmactions/omnios-vm@027e3ec08fed6fb740ab5f300c2605f9de02997a # v1.3.4
        with:
          release: "r151056-build"
          prepare: |
            set -e
            pkg install build-essential pkg-config
            curl --proto '=https' --location --fail -o bootstrap.tar.gz "${{ env.SMARTOS_BOOTSTRAP_URL }}"
            bootstrap_sha256=$(digest -a sha256 bootstrap.tar.gz)
            if [ "$bootstrap_sha256" != "${{ env.SMARTOS_BOOTSTRAP_SHA256 }}" ]; then
              echo "bootstrap.tar.gz SHA-256 mismatch" >&2
              exit 1
            fi
            tar -zxpf bootstrap.tar.gz -C /
            export PATH=/opt/local/sbin:/opt/local/bin:/usr/gnu/bin:/usr/bin:/usr/sbin:/sbin:$PATH
            pkgin -y install gmake pkg-config rust
          run: |
            set -e
            export PATH=/opt/local/sbin:/opt/local/bin:/usr/gnu/bin:/usr/bin:/usr/sbin:/sbin:$PATH
            cargo test --workspace --locked
            cargo build --release --locked
            cargo build --release --locked -p stuffit-ffi
            gmake -C stuffit-ffi install-files PREFIX=/opt/local
            export LD_LIBRARY_PATH=/opt/local/lib
            export PKG_CONFIG_PATH=/opt/local/lib/pkgconfig
            c_compiler=$(command -v cc || command -v gcc)
            "$c_compiler" stuffit-ffi/examples/probe.c -o stuffit-ffi-probe $(pkg-config --cflags --libs stuffit-ffi)

  openindiana:
    name: OpenIndiana
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, and install
        uses: vmactions/openindiana-vm@3af32bfaa450c7c53b35b1da080564c85cac4ae8 # v1.1.4
        with:
          release: "202510-build"
          prepare: |
            pkg install \
              developer/build/gnu-make \
              developer/build/pkg-config \
              developer/cargo-c \
              developer/gcc-14 \
              developer/lang/rustc
          run: |
            set -e
            cargo test --workspace --locked
            cargo build --release --locked
            cargo build --release --locked -p stuffit-ffi
            gmake -C stuffit-ffi install-files PREFIX=/usr/local
            export LD_LIBRARY_PATH=/usr/local/lib
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/amd64/pkgconfig
            c_compiler=$(command -v cc || command -v gcc)
            "$c_compiler" stuffit-ffi/examples/probe.c -o stuffit-ffi-probe $(pkg-config --cflags --libs stuffit-ffi)

  solaris:
    name: Solaris
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build, test, and install
        uses: vmactions/solaris-vm@d30dd6c228c8661ade859e36ead7660b9a62efcc # v1.3.7
        with:
          release: "11.4-clang-19"
          prepare: |
            pkg install \
              developer/build/gnu-make \
              developer/rust/cargo \
              developer/rust/rustc \
              pkg-config
          run: |
            set -e
            cargo test --workspace --locked
            cargo build --release --locked
            cargo build --release --locked -p stuffit-ffi
            gmake -C stuffit-ffi install-files PREFIX=/usr/local
            export LD_LIBRARY_PATH=/usr/local/lib
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/amd64/pkgconfig
            c_compiler=$(command -v cc || command -v gcc)
            "$c_compiler" stuffit-ffi/examples/probe.c -o stuffit-ffi-probe $(pkg-config --cflags --libs stuffit-ffi)
